stages:
  - test
  - pages

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

backend:test:
  stage: test
  image: golang:latest
  script:
    - cd backend
    - go test ./... -coverpkg=./... -coverprofile=coverage.out
    - go tool cover -html=coverage.out -o coverage.html
  artifacts:
    paths:
      - backend/coverage.html

backend:lint:
  stage: test
  image: golangci/golangci-lint:latest
  script:
    - cd backend
    - golangci-lint run ./...

backend:security:
  stage: test
  image: golang:latest
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - cd backend
    - $GOPATH/bin/gosec ./...

frontend:build:
  stage: test
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

frontend:test:
  stage: test
  image: node:22
  variables:
    CHROME_BIN: /usr/bin/google-chrome
  script:
    - wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt-get update && apt-get install -y /tmp/chrome.deb
    - cd frontend
    - npm ci
    - mkdir -p tests
    - echo "<html><body><pre>" > tests/units.html
    - npm run test:report | sed 's/\x1b\[[0-9;]*[mGKHF]//g' >> tests/units.html
    - echo "</pre></body></html>" >> tests/units.html
  artifacts:
    paths:
      - frontend/tests/units.html

pages:
  stage: pages
  image: alpine:latest
  needs:
    - backend:test
    - frontend:test
  script:
    - mkdir -p public/coverage public/test-report
    - cp backend/coverage.html public/coverage/index.html
    - cp frontend/tests/units.html public/test-report/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
