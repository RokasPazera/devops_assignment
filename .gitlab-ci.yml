
stages:
  - test
  - pages
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_TAG'

backend:test:
  stage: test
  image: golang:latest
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - backend/vendor/
      - $GOPATH/pkg/mod/
  script:
    - cd backend
    - go test ./... -coverpkg=./... -coverprofile=coverage.out
    - go tool cover -html=coverage.out -o coverage.html
  artifacts:
    paths:
      - backend/coverage.html

backend:lint:
  stage: test
  image: golangci/golangci-lint:latest
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - backend/vendor/
  script:
    - cd backend
    - golangci-lint run ./...

backend:security:
  stage: test
  image: golang:latest
  allow_failure: true
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/mod/
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - cd backend
    - $GOPATH/bin/gosec ./...

frontend:build:
  stage: test
  image: node:22
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - |
      if [ -n "$API_URL" ]; then
        echo "export const environment = { production: true, apiUrl: '$API_URL' };" > src/environments/environment.aws.ts
      fi
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

frontend:test:
  stage: test
  image: node:22
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  variables:
    CHROME_BIN: /usr/bin/google-chrome
  script:
    - wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt-get update && apt-get install -y /tmp/chrome.deb
    - cd frontend
    - npm ci
    - mkdir -p tests
    - echo "<html><body><pre>" > tests/units.html
    - npm run test:report | sed 's/\x1b\[[0-9;]*[mGKHF]//g' >> tests/units.html
    - echo "</pre></body></html>" >> tests/units.html
  artifacts:
    paths:
      - frontend/tests/units.html

pages:
  stage: pages
  image: alpine:latest
  needs:
    - backend:test
    - frontend:test
  script:
    - mkdir -p public/coverage public/test-report
    - cp backend/coverage.html public/coverage/index.html
    - cp frontend/tests/units.html public/test-report/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build:backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_TAG'

deploy:backend:
  stage: deploy
  image: alpine:latest
  needs:
    - build:backend
  before_script:
    - apk add --no-cache openssh-client aws-cli
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - |
      INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
        --auto-scaling-group-names thermometer-asg \
        --query 'AutoScalingGroups[0].Instances[].InstanceId' \
        --output text)
      INSTANCE_IPS=$(aws ec2 describe-instances \
        --instance-ids $INSTANCE_IDS \
        --query 'Reservations[].Instances[].PublicIpAddress' \
        --output text)
      for IP in $INSTANCE_IPS; do
        ssh -o StrictHostKeyChecking=no ec2-user@$IP "
          until sudo docker info; do echo 'Waiting for Docker...'; sleep 5; done &&
          sudo docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
          sudo docker pull $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG &&
          sudo docker stop backend || true &&
          sudo docker rm backend || true &&
          sudo docker run -d --name backend --restart always -p 8000:8000 \
            -e DB_TYPE=mssql \
            -e DB_CONNECTION=\"$DB_CONNECTION\" \
            $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG"
      done
  rules:
    - if: '$CI_COMMIT_TAG'

deploy:frontend:
  stage: deploy
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  needs:
    - job: frontend:build
      artifacts: true
  script:
    - aws s3 sync frontend/dist/frontend-angular/browser/ s3://$S3_BUCKET --delete
  rules:
    - if: '$CI_COMMIT_TAG'
